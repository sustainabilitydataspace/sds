name: sds-public-demo

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sds
      POSTGRES_USER: sds
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Run python scripts/bootstrap_public_env.py first}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REQUIRE_DATABASE: "${REQUIRE_DATABASE:-true}"
      DATABASE_URL: "postgresql://sds:${POSTGRES_PASSWORD:?Run python scripts/bootstrap_public_env.py first}@postgres:5432/sds"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Run python scripts/bootstrap_public_env.py first}"
      SEED_REFERENCE_DATA_ON_STARTUP: "${SEED_REFERENCE_DATA_ON_STARTUP:-true}"
      SEED_DEFAULT_USERS: "${SEED_DEFAULT_USERS:-false}"
      VALUE_REVISION_PRIMARY_READ_PATH: "${VALUE_REVISION_PRIMARY_READ_PATH:-revision}"
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:8090"]}'
      CORS_ALLOW_CREDENTIALS: "${CORS_ALLOW_CREDENTIALS:-false}"
      PORTAL_MOUNT_ENABLED: "${PORTAL_MOUNT_ENABLED:-false}"
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/ready')"]
      interval: 10s
      timeout: 5s
      retries: 18

volumes:
  postgres_data:
