name: API CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/api-ci.yml"
      - ".github/workflows/docker-quickstart-smoke.yml"
      - "Makefile"
      - "README.md"
      - "api/**"
      - "packages/**"
      - "semantics/**"
      - "governance/**"
      - "configs/**"
      - "deliverables/**"
      - "docs/quality/acceptance_gates.md"
      - "scripts/**"
      - "scripts/api_ci_pre_push.py"
      - "scripts/install_api_ci_pre_push_hook.py"
  pull_request:
    paths:
      - ".github/workflows/api-ci.yml"
      - ".github/workflows/docker-quickstart-smoke.yml"
      - "Makefile"
      - "README.md"
      - "api/**"
      - "packages/**"
      - "semantics/**"
      - "governance/**"
      - "configs/**"
      - "deliverables/**"
      - "docs/quality/acceptance_gates.md"
      - "scripts/**"
      - "scripts/api_ci_pre_push.py"
      - "scripts/install_api_ci_pre_push_hook.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality-security-test:
    name: API quality, security, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # sds-canonical-json-v1 requires Unicode 13.0.0 (CPython 3.10).
          python-version: "3.10"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: make lint

      - name: Security scan
        run: make security-scan

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-security-reports
          path: api/artifacts/security/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Test coverage
        run: make test-coverage

      # The operational value-import performance gate needs a live PostgreSQL
      # instance and is intentionally outside this source-native CI mirror
      # until a dedicated service-container job defines the runtime envelope.
      # - name: Performance gate (optional)
      #   run: make gate-value-import-performance
      #   env:

  api-runtime-compatibility:
    name: API runtime compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SDS_RUNTIME_COMPATIBILITY_SCOPE: noncanonical-service-runtime
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate service runtime compatibility
        run: |
          make check-python
          python -m compileall -q src
          python -m pytest \
            tests/test_f02_auth_hardening.py \
            tests/test_healthz_dependency_status.py \
            tests/test_settings_extra_env.py \
            tests/test_settings_security.py
